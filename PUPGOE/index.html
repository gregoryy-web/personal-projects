<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PUP Equivalence of Grades</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>

<body>
    <h3 class="text-center p-4 m-0" style="background-color: maroon; color: white;">PUP Equivalence of Grades</h3>

    <div class="container mt-4" style="max-width: 600px;">
        <div class="row">
            <div class="col">
                <div class="card shadow p-4">
                    <h4 class="mb-3 text-center">Grade Calculator</h4>
                    
                    <div class="mb-3 mt-4">
                        <label for="gradeInput" class="form-label">Enter your numerical grade (example: 90):</label>
                        <input type="number" id="gradeInput" class="form-control mt-4" placeholder="Enter your grade here" min="0" max="100">
                    </div>

                    <button class="btn w-100 mt-4" style="background-color: maroon; color: white; border-color: maroon;" onclick="calculateGrade()">Calculate</button>

                    <div id="resultContainer" class="mt-4 text-center" style="display: none;">
                        <h5>Result:</h5>
                        <p class="fs-4 fw-bold text-success" id="equivalentText"></p>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script>
        function calculateGrade() {
            let grade = parseFloat(document.getElementById('gradeInput').value);
            let resultBox = document.getElementById('resultContainer');
            let equivalentText = document.getElementById('equivalentText');

            if (isNaN(grade) || grade < 0 || grade > 100) {
                alert("Please enter a valid grade between 0 and 100.");
                return;
            }

            let equivalent = "";

            if (grade >= 97 && grade <= 100) {
                equivalent = "1.00 (Excellent)";
            } else if (grade >= 94 && grade <= 96) {
                equivalent = "1.25 (Excellent)";
            } else if (grade >= 91 && grade <= 93) {
                equivalent = "1.50 (Very Good)";
            } else if (grade >= 88 && grade <= 90) {
                equivalent = "1.75 (Very Good)";
            } else if (grade >= 85 && grade <= 87) {
                equivalent = "2.00 (Good)";
            } else if (grade >= 82 && grade <= 84) {
                equivalent = "2.25 (Good)";
            } else if (grade >= 79 && grade <= 81) {
                equivalent = "2.50 (Satisfactory)";
            } else if (grade >= 76 && grade <= 78) {
                equivalent = "2.75 (Satisfactory)";
            } else if (grade == 75) {
                equivalent = "3.00 (Passing)";
            } else {
                equivalent = "5.00 (Failed)";
            }


        
            equivalentText.innerHTML = "PUP Equivalence: " + equivalent;
            resultBox.style.display = "block";
        }
    </script>

    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
</body>

</html>
